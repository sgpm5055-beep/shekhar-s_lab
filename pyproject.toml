[project]
name = "eligibility-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.2.14,<2.0",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0",
    "langchain-openai>=1.6.7,<2.0",
    "langchain-core>=1.6.8,<2.0",
    "langsmith>=0.14.4,<0.15",
    "fastapi>=0.142.2,<0.150",
    "uvicorn>=0.54,<0.55",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "supabase>=2.32.0,<3.0",
    "httpx>=0.27,<0.29",
    "psycopg[binary]>=3.2,<4.0",
    "psycopg-pool>=3.2,<4.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-socket>=0.8.1,<0.9",
    "pyright[nodejs]>=1.1.405,<1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eligibility_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-socket --allow-unix-socket"
markers = [
    "eval: local golden-dataset eval runs",
]

[tool.pyright]
include = ["eligibility_agent", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
executionEnvironments = [
    { root = "tests", reportPrivateUsage = false },
]
